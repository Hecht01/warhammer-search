name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint, Test, Build
    runs-on: ubuntu-latest

    # Note: Qdrant service container removed because all current tests use mocking
    # If integration tests are added later that need a real Qdrant instance,
    # uncomment the services section below and fix the health check

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest black flake8

      - name: Lint with flake8
        run: |
          flake8 . --exclude=venv,.venv,.git,__pycache__,data --max-line-length=100

      - name: Format check with black
        run: |
          black --check .

      - name: Run tests
        run: |
          pytest tests/ -v

      - name: Build Docker image
        run: |
          docker build -t warhammer-api .
